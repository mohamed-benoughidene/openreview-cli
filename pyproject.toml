[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openreview-cli"
version = "0.1.0"
description = "Privacy-first contract review tool"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.90.1",
    "numpy>=1.24",
    "nupunkt>=0.6.0",
    "platformdirs>=4.10.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "scikit-learn>=1.3",
    "textual>=8.2.8",
    "torch>=2.0",
    "transformers>=4.38",
    "typer>=0.26.7",
]

[project.scripts]
openreview = "openreview_cli.app:app"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.18",
    "types-pyyaml>=6.0.12.20260518",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/openreview_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".tools"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
    "PL",
    "TRY",
]
ignore = [
    "E501",
    "PLC0415",  # lazy imports per constitution Principle III
    "PLR0913",
    "PLR2004",
    "TC001",    # from __future__ import annotations + lazy imports per Principle III
    "TC002",
    "TC003",
    "TRY003",   # descriptive exception messages are fine in CLI tools
]
unfixable = ["B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"src/openreview_cli/tui/domain/gateway.py" = ["E402", "UP047", "PLW0108"]
"src/openreview_cli/tui/domain/playbooks.py" = ["TRY300"]
"src/openreview_cli/tui/domain/privacy.py" = ["TRY300"]
"src/openreview_cli/tui/screens/gateway_wizard.py" = ["SIM114"]
"src/openreview_cli/tui/screens/playbook_detail.py" = ["RUF059"]
"src/openreview_cli/tui/screens/progress.py" = ["SIM105"]
"src/openreview_cli/tui/screens/result.py" = ["SIM117", "RUF015"]
"tests/**" = ["PLR0913", "PLR2004", "S101", "PLR0912", "PLR0915", "TC001", "TC002", "TC003", "RUF012", "RUF059", "SIM115", "N806", "PLW2901", "PLW1510", "F841", "E402", "PLW0602"]
"scripts/**" = ["PLR0912", "PLR0915", "RUF059"]
"src/openreview_cli/parsing/pdf_parser.py" = ["PLR0912", "PLR0915"]
"src/openreview_cli/parsing/clause_detector.py" = ["PLW0603"]
"src/openreview_cli/benchmark/cli.py" = ["PLR0912", "PLR0915", "B008"]
"src/openreview_cli/app.py" = ["PLR0912", "PLR0915", "B008"]

"src/openreview_cli/review/memo/formats.py" = ["PLR0912", "PLR0915"]

"src/openreview_cli/pipeline/runner.py" = ["PLR0912", "PLR0915"]
"src/openreview_cli/benchmark/report.py" = ["PLR0911"]
"src/openreview_cli/negotiation/solvers.py" = ["PLR0911"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
no_implicit_reexport = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "questionary"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.integration.tui.*",
    "tests.unit.tui.*",
    "tests.unit.test_app_tui_dispatch",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (skip with '-m not slow')",
    "integration: marks integration tests (mocked APIs)",
    "e2e: marks end-to-end tests (CLI invocation)",
    "memory: marks memory profiling tests",
    "benchmark: marks benchmark tests",
    "accuracy: marks clause boundary accuracy tests",
    "network: marks tests requiring HuggingFace hub network access (legal-bert model download)",
]
filterwarnings = ["ignore::DeprecationWarning"]
