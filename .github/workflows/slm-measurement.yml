name: SLM slot measurement

# Measures clause-detection quality of local (Ollama) models on the bundled
# fixtures. This is a measurement, not a test: it reports numbers, it does not
# gate anything. Reranking is not measured (no local Ollama rerank support).

on:
  workflow_dispatch:
    inputs:
      require_pass_agreement:
        description: >-
          Grounding-accuracy job only: run its arm with the discriminator's
          both-passes-must-agree rule ON. Default off, matching the shipped product.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: ollama/qwen3:4b
            pull: qwen3:4b
            slug: qwen3-4b
          - model: ollama/granite4:3b
            pull: granite4:3b
            slug: granite4-3b
          - model: ollama/phi4-mini:3.8b
            pull: phi4-mini:3.8b
            slug: phi4-mini-3.8b
          - model: ollama/gemma3:4b
            pull: gemma3:4b
            slug: gemma3-4b
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and wait until it answers
        run: |
          nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama-serve.log
          exit 1

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-measure-${{ matrix.slug }}

      - name: Pull model
        run: |
          ollama pull "${{ matrix.pull }}"
          ollama list

      - name: Measure
        run: |
          uv run python scripts/measure_slm_slots.py \
            --model "${{ matrix.model }}" \
            --no-pii \
            --mode indemnitycheck \
            --out "results/${{ matrix.slug }}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slm-result-${{ matrix.slug }}
          path: results/${{ matrix.slug }}.json
          if-no-files-found: warn

  report:
    needs: [measure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: slm-result-*
          merge-multiple: true

      - name: Build report
        run: |
          python3 - <<'PY'
          import glob, json, pathlib

          loaded = [json.loads(pathlib.Path(p).read_text()) for p in sorted(glob.glob("results/*.json"))]
          rows = [r for r in loaded if "totals" in r]
          rows.sort(key=lambda r: r["recall"], reverse=True)
          sha = rows[0]["git_sha"] if rows else "unknown"
          lines = [
              "# SLM slot measurement — indemnitycheck fixtures",
              "",
              f"- commit: `{sha}` · models: {len(rows)} · documents per model: "
              f"{rows[0]['documents'] if rows else 0}",
              "- metric: category recall (expected category detected) and position accuracy "
              "(detected position equals the expected playbook position).",
              "",
              "| model | matched | expected | recall | position acc | extraction failures | seconds |",
              "|---|---|---|---|---|---|---|",
          ]
          for r in rows:
              t = r["totals"]
              secs = round(sum(d["seconds"] for d in r["per_document"]), 1)
              errs = t.get("extraction_errors", 0)
              lines.append(
                  f"| `{r['model']}` | {t['matched']} | {t['expected']} | {r['recall']} | "
                  f"{r['position_accuracy']} | {errs} | {secs} |"
              )
          lines += [
              "",
              "## Method and limits",
              "- Pipeline: product review (parse → review) with PII stripping skipped (`--no-pii`), "
              "synthetic fixtures only.",
              "- A category counts as detected only when the extraction did not fail; the pipeline's "
              "failure fallback stamps the category id and would otherwise fake a match.",
              "- Category matching is lexical (`match_category` runs before the model and the fixtures "
              "embed the category name), so *category recall is not a model metric*: the model only "
              "chooses the position. Read **position accuracy** as the model signal.",
              "- One run per document; local models are not deterministic, so numbers are a single sample.",
              "- n = 5 documents per model; each document labels 2–4 categories. Treat this as a smoke "
              "measurement, not a benchmark.",
              "- Reranking is excluded: no local Ollama rerank support.",
          ]
          md = "\n".join(lines)
          pathlib.Path("slm-measurement-report.md").write_text(md)
          print(md)
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slm-measurement-report
          path: slm-measurement-report.md
          if-no-files-found: warn

  # Grounding accuracy: the `--grounding-accuracy` mode of the same script scores
  # CitationGroundingDiscriminator against known-good and known-bad claims built from
  # real clause text. It needs a model that can actually answer, so it runs the
  # shipped local grounding default (`--arm local` -> ollama/granite4:3b) on Ollama.
  #
  # Corpus: the mode's real default (data/legalbenchrag/corpus/cuad) is gitignored and
  # absent in CI, so this job assembles a deterministic corpus from the repository's
  # own tracked fixture documents -- the tests/fixtures/**.txt fixtures verbatim, plus
  # the fixture PDFs/DOCX parsed to text with the product's own parser. No network is
  # used to build it. The job prints the corpus provenance and the real sample size,
  # and the receipt's `units`/`limit` fields carry the same numbers.
  #
  # Failure policy: a legitimate skip (an absent/empty corpus) exits 0 and leaves the
  # job green, but a non-zero harness exit (arm unreachable, PII strip failed, gateway
  # unbuildable) fails the job -- a measurement that could not run must not look like a
  # green run. The receipt is uploaded on every outcome (if: always()).
  #
  # Exit 0 is not enough, so the job also re-reads the receipt and fails when it shows no
  # usable measurement: `all_uncertain` is true (the discriminator swallows a failed gateway
  # call as 'uncertain', so a run that died mid-arm still exits 0), either arm is empty
  # (`positives == 0` or `negatives_kept == 0`), no paraphrased label reached `per_label` (the
  # substitution map matched nothing, so the run measured the verbatim-only arm), or `units` is
  # below the --limit the job asked for (that limit is a maximum, not an assertion). Counting is
  # not a measurement.
  grounding-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and wait until it answers
        # OLLAMA_KEEP_ALIVE is set on the server so the grounding model stays resident for the
        # whole measurement: the harness makes ~60 sequential calls, and a mid-run unload whose
        # cold reload exceeds the gateway's 60 s per-call timeout would turn into the
        # all-uncertain "measured nothing" case the step below now rejects. The wait loop is
        # unchanged.
        run: |
          OLLAMA_KEEP_ALIVE=30m nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama-serve.log
          exit 1

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-grounding-granite4-3b

      - name: Pull granite4:3b (the --arm local grounding model)
        run: |
          ollama pull granite4:3b
          ollama list

      - name: Assemble a deterministic corpus from tracked fixture documents
        run: |
          uv run python - <<'PY'
          import importlib.util
          import os
          import pathlib
          import re
          import sys

          ROOT = pathlib.Path(".").resolve()
          spec = importlib.util.spec_from_file_location(
              "measure_slm_slots", ROOT / "scripts" / "measure_slm_slots.py"
          )
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)

          from openreview_cli.parsing.stream import stream_clauses

          EXCLUDE_PARTS = {"pii", "redteam", "prompts", "__pycache__"}
          SKIP_NAMES = {
              "corrupt.pdf",
              "empty.pdf",
              "scanned.pdf",
              "password_protected.pdf",
              "500_page.pdf",
              "50_page.pdf",
          }
          MARKER = re.compile(r"##[A-Za-z_]+##")
          MAX_BYTES = 1_000_000

          def normalize(text):
              return " ".join(MARKER.sub(" ", text.replace("CLAUSE:", " ")).split())

          seen = set()
          per_doc = []
          sources = []

          def collect(source, texts):
              # Reuse the harness's own unit rule so the corpus is exactly the set of
              # paragraphs the harness would accept (>= 200 chars, >= 2 sentences).
              units = []
              for raw in texts:
                  text = normalize(raw)
                  if text and text not in seen and harness._unit_qualifies(text):
                      seen.add(text)
                      units.append(text)
              if units:
                  per_doc.append(units)
                  sources.append(source)

          considered = 0
          for path in sorted(ROOT.glob("tests/fixtures/**/*.txt")):
              if EXCLUDE_PARTS & set(path.parts) or path.stat().st_size > MAX_BYTES:
                  continue
              considered += 1
              collect(
                  str(path.relative_to(ROOT)),
                  harness._paragraphs(path.read_text(encoding="utf-8", errors="replace")),
              )

          parsed = 0
          for path in sorted(ROOT.glob("tests/fixtures/**/*.pdf")) + sorted(
              ROOT.glob("tests/fixtures/**/*.docx")
          ):
              if EXCLUDE_PARTS & set(path.parts) or path.name in SKIP_NAMES:
                  continue
              if path.stat().st_size > MAX_BYTES:
                  continue
              considered += 1
              try:
                  clauses = list(stream_clauses(path, allow_password_prompt=False))
              except Exception:  # a fixture that cannot parse contributes nothing
                  continue
              parsed += 1
              collect(str(path.relative_to(ROOT)), [c.text or "" for c in clauses])

          # Round-robin across source documents so the harness's first `limit` units
          # span many documents, not just the alphabetically-first one.
          interleaved = []
          depth = 0
          while True:
              added = False
              for units in per_doc:
                  if depth < len(units):
                      interleaved.append(units[depth])
                      added = True
              if not added:
                  break
              depth += 1

          out_dir = pathlib.Path("corpus")
          if out_dir.exists():
              for stale in out_dir.glob("*.txt"):
                  stale.unlink()
          out_dir.mkdir(parents=True, exist_ok=True)
          for i, text in enumerate(interleaved):
              (out_dir / f"unit_{i:04d}.txt").write_text(text + "\n", encoding="utf-8")

          line = (
              f"[corpus] assembled {len(interleaved)} clause units from "
              f"{len(per_doc)} tracked fixture documents "
              f"({considered} fixture files considered; {parsed} PDF/DOCX parsed to text). "
              "Source: tests/fixtures/**.txt verbatim + fixture PDFs/DOCX parsed with "
              "openreview_cli.parsing -- NOT the gitignored CUAD corpus."
          )
          print(line)
          contributing = sorted(sources)
          print(f"[corpus] contributing documents: {', '.join(contributing)}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              # Provenance in the job summary: a reader must be able to see the sample
              # (how many qualifying units, from which tracked documents) without the log.
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(
                      f"### Grounding corpus\n\n{line}\n\n"
                      f"- units assembled: {len(interleaved)}\n"
                      f"- contributing documents: {len(contributing)}\n"
                      f"- document list: {', '.join(f'`{s}`' for s in contributing)}\n"
                  )
          if not interleaved:
              sys.exit("corpus assembly produced no units; refusing to measure an empty corpus")
          PY

      - name: Warm the grounding model so the pre-flight is not the cold start
        # Defect: the harness pre-flight is the first inference after `ollama pull`, so the
        # model is not resident yet, and the gateway's per-call timeout is 60 s; on a 2-vCPU
        # runner a cold 3B load can exceed that and fail a healthy arm. `ollama run` has no
        # such cap -- it loads the weights and answers, and OLLAMA_KEEP_ALIVE (above) keeps the
        # model resident through the corpus assembly and the ~60-call measurement.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if out=$(ollama run granite4:3b "Reply with the single word OK." 2>&1); then
              echo "warm-up answered on attempt ${attempt}: ${out}"
              ollama ps
              exit 0
            fi
            echo "warm-up attempt ${attempt} failed:"
            echo "${out}"
          done
          echo "the grounding model did not answer three warm-up calls; refusing to run the pre-flight cold"
          exit 1

      - name: Run the grounding-accuracy harness (--arm local, limit 20)
        # Plain invocation on purpose: the harness exits 1 when an arm is unreachable,
        # so the step (and the job) fail and the broken run is visible. A legitimate
        # skip exits 0 and stays green.
        #
        # The `require_pass_agreement` dispatch input turns the discriminator's
        # both-passes-must-agree rule on for this arm; it is off by default (the shipped
        # product's setting), so the same job can be dispatched either way. The harness
        # records the setting in the receipt.
        env:
          REQUIRE_PASS_AGREEMENT: >-
            ${{ inputs.require_pass_agreement && '--require-pass-agreement' || '' }}
        run: |
          uv run python scripts/measure_slm_slots.py \
            --grounding-accuracy \
            --arm local \
            --limit 20 \
            --no-pii \
            --corpus-dir corpus \
            --out results/grounding-accuracy-local.json \
            $REQUIRE_PASS_AGREEMENT

      - name: Report what the receipt measured
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("results/grounding-accuracy-local.json")
          if not path.exists():
              print(f"[receipt] no receipt at {path}; the harness did not get far enough to write one")
              raise SystemExit(0)

          receipt = json.loads(path.read_text())
          print(
              f"[receipt] mode={receipt['mode']} arm={receipt['arm']} "
              f"grounding_model={receipt['slots']['grounding']} git_sha={receipt['git_sha']} "
              f"require_pass_agreement={receipt['require_pass_agreement']}"
          )
          if receipt.get("skipped"):
              print(
                  f"[receipt] SKIPPED skip_kind={receipt.get('skip_kind')}: "
                  f"{receipt.get('skip_reason')}"
              )
          else:
              print(
                  f"[receipt] corpus_dir={receipt['corpus_dir']} "
                  f"corpus_files_scanned={receipt['corpus_files_scanned']} "
                  f"limit={receipt['limit']} units={receipt['units']}"
              )
              print(
                  f"[receipt] positives={receipt['positives']} "
                  f"negatives_kept={receipt['negatives_kept']} "
                  f"negatives_dropped_guard={receipt['negatives_dropped_guard']} "
                  f"paraphrases_skipped={receipt['paraphrases_skipped']} "
                  f"second_pass_fallbacks={receipt['second_pass_fallbacks']}"
              )
              print(
                  f"[receipt] bad_caught={receipt['bad_caught']}/{receipt['negatives_kept']} "
                  f"caught_rate={receipt['caught_rate']} "
                  f"false_reject_rate={receipt['false_reject_rate']} "
                  f"latency_calls={receipt['latency']['calls']} "
                  f"mean={receipt['latency']['mean']}s"
              )
              if receipt.get("all_uncertain"):
                  print(
                      "[receipt] WARNING: every verdict is 'uncertain' -- the arm was "
                      "probably unreachable"
                  )
          print(f"[receipt] pii: {receipt['pii']['note']}")

          # Provenance in the job summary (documents and units) so a reader can see the sample
          # without opening the log.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and not receipt.get("skipped"):
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(
                      "### Grounding-accuracy sample\n\n"
                      f"- arm: `{receipt['arm']}`; grounding model: "
                      f"`{receipt['slots']['grounding']}`\n"
                      f"- corpus dir: `{receipt['corpus_dir']}` "
                      f"({receipt['corpus_files_scanned']} corpus files scanned)\n"
                      f"- units measured: {receipt['units']} (the job asks for --limit "
                      f"{receipt['limit']})\n"
                      f"- positives: {receipt['positives']}; negatives kept: "
                      f"{receipt['negatives_kept']}\n"
                      f"- both-passes-agree rule: {receipt['require_pass_agreement']} "
                      f"(second-pass fallbacks: {receipt['second_pass_fallbacks']})\n"
                  )
          PY

      - name: Fail when the receipt shows no usable measurement
        # Defect 1: the discriminator swallows a failed gateway call and returns the verdict
        # 'uncertain' (grounding/discriminator.py); when every verdict is uncertain the harness
        # records all_uncertain: true and still exits 0, so the job could go green having
        # measured nothing (the arm answers the pre-flight, then dies or degenerates mid-run).
        # A matrix with no positives or no negatives measures nothing either.
        # Defect 3: --limit is a maximum, not an assertion, so a corpus that shrank below the
        # sample this job claims must fail too.
        # A legitimate skip (absent/empty corpus -> skipped: true) still passes, and this step
        # runs AFTER the harness step so a non-zero harness exit is not masked either.
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          import os
          import pathlib

          # The job asks for --limit 20; the floor is the same number, because a run that
          # reaches fewer units is not the sample the job advertises.
          REQUIRED_UNITS = 20

          path = pathlib.Path("results/grounding-accuracy-local.json")
          if not path.exists():
              raise SystemExit(
                  f"FAIL: no receipt at {path}: the harness wrote nothing, so there is no "
                  "evidence that a measurement ran"
              )

          receipt = json.loads(path.read_text())

          # The one legitimate skip is an absent/empty corpus (the documented CI case, exit 0).
          # Every other skip_kind today (arm_unreachable, pii_unavailable, gateway_unavailable,
          # arm_misconfigured) means no measurement ran, and the harness exits 1 for those --
          # this step fails closed on them rather than trusting a future exit 0.
          if receipt.get("skipped") and receipt.get("skip_kind") == "corpus_absent":
              print(
                  f"OK: legitimate skip (skip_kind=corpus_absent): {receipt.get('skip_reason')} "
                  "-- an absent/empty corpus exits 0 and stays green"
              )
              raise SystemExit(0)

          problems = []
          if receipt.get("skipped"):
              problems.append(
                  f"skipped is true with skip_kind={receipt.get('skip_kind')!r}: "
                  f"{receipt.get('skip_reason')} -- only an absent/empty corpus "
                  "(skip_kind=corpus_absent) is a legitimate skip; this run measured nothing"
              )
          elif receipt.get("all_uncertain"):
              problems.append(
                  "all_uncertain is true: every verdict was 'uncertain', and the discriminator "
                  "returns 'uncertain' for a failed gateway call, so this run measured nothing "
                  "(the arm answered the pre-flight and then died or degenerated mid-run)"
              )
          # The arm/sample checks below only apply to a run that got as far as a matrix; a
          # skip receipt carries no arms and no units.
          if not receipt.get("skipped") and receipt.get("positives", 0) == 0:
              problems.append(
                  "positives == 0: the positive arm is empty, so the matrix measures nothing"
              )
          if not receipt.get("skipped") and receipt.get("negatives_kept", 0) == 0:
              problems.append(
                  "negatives_kept == 0: the negative arm is empty, so the matrix measures nothing"
              )
          # The paraphrase classes are what make these labels about wording rather than
          # quoting. If neither class reaches per_label, every rewrite was a no-op (the
          # substitution map matched nothing in the assembled corpus) and the run silently
          # measured the old verbatim-only arm. Fail on the labels actually scored, not on a
          # skip count that a future writer could inflate.
          paraphrase_generators = {"paraphrased_supported", "paraphrased_unsupported"}
          scored_generators = {row.get("generator") for row in receipt.get("per_label", [])}
          if not receipt.get("skipped") and not (paraphrase_generators & scored_generators):
              problems.append(
                  "no paraphrased labels: neither 'paraphrased_supported' nor "
                  "'paraphrased_unsupported' appears in per_label "
                  f"(paraphrases_skipped={receipt.get('paraphrases_skipped')}), so every "
                  "rewrite was a no-op and the run measured the verbatim-only arm"
              )
          units = receipt.get("units", 0)
          if not receipt.get("skipped") and units < REQUIRED_UNITS:
              problems.append(
                  f"units={units} is below the required {REQUIRED_UNITS} "
                  f"(the job asked for --limit {receipt.get('limit')}): the assembled corpus "
                  "has too few qualifying units to be the sample this job claims"
              )

          if problems:
              print("FAIL: the receipt shows no usable measurement:")
              for problem in problems:
                  print(f"  - {problem}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("### Grounding-accuracy measurement failed\n\n")
                      for problem in problems:
                          handle.write(f"- {problem}\n")
              raise SystemExit(1)

          print(
              f"OK: units={units}/{receipt['limit']} positives={receipt['positives']} "
              f"negatives_kept={receipt['negatives_kept']} "
              f"bad_caught={receipt['bad_caught']}/{receipt['negatives_kept']}"
          )
          PY

      - name: Upload grounding-accuracy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-accuracy-local
          path: results/grounding-accuracy-local.json
          if-no-files-found: warn

  # Grounding pilot: the one place CI runs a REAL product review with citation grounding ON
  # (the `measure` matrix deliberately leaves grounding off, `grounding_mode: null`, so it can
  # compare extraction quality across models). Nothing else in CI enables grounding, so nothing
  # else can show whether a real citation's wording sits above the coverage line -- the open
  # question the whole presence-signals design rests on.
  #
  # It runs exactly ONE product review over the repository's tracked fixtures with the shipped
  # local grounding model (`ollama/granite4:3b`, the same one `--arm local` uses), records how
  # much of each cited claim's wording is in the clause it cites, and prints the coverage
  # distribution. This is a sample (a pilot), not a benchmark: the number is recorded, never
  # scored, and no verdict is derived from it.
  #
  # Why lenient and not strict: strict grounding DELETES every claim the model rejected
  # (`grounding/models.py` keeps only grounded assessments), and those rejected claims are
  # exactly the low-coverage population this pilot exists to see. Running strict would leave
  # only the survivors and answer nothing.
  #
  # Failure policy: same fail-loud spirit as `grounding-accuracy` -- a run that produced no
  # assessments at all (or no coverage number on any of them) fails the job rather than pass as
  # a green nothing; the report is uploaded on every outcome (if: always()).
  grounding-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and wait until it answers
        # Same keep-alive as `grounding-accuracy`: the review makes many sequential grounding
        # calls, and a mid-run unload whose cold reload exceeds the gateway's 60 s per-call
        # timeout would turn into the "measured nothing" case the step below rejects.
        run: |
          OLLAMA_KEEP_ALIVE=30m nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama-serve.log
          exit 1

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-grounding-granite4-3b

      - name: Pull granite4:3b (the local grounding model)
        run: |
          ollama pull granite4:3b
          ollama list

      - name: Warm the grounding model so the first review call is not the cold start
        # Copied from `grounding-accuracy`: the first inference after `ollama pull` loads the
        # weights, and the gateway's per-call timeout is 60 s; `ollama run` has no such cap and
        # OLLAMA_KEEP_ALIVE (above) keeps the model resident through the review.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if out=$(ollama run granite4:3b "Reply with the single word OK." 2>&1); then
              echo "warm-up answered on attempt ${attempt}: ${out}"
              ollama ps
              exit 0
            fi
            echo "warm-up attempt ${attempt} failed:"
            echo "${out}"
          done
          echo "the grounding model did not answer three warm-up calls; refusing to start the review cold"
          exit 1

      - name: Run one grounded review (lenient) and write the pilot report
        run: |
          uv run python - <<'PY'
          import importlib.util
          import json
          import os
          import pathlib
          import time

          ROOT = pathlib.Path(".").resolve()
          spec = importlib.util.spec_from_file_location(
              "measure_slm_slots", ROOT / "scripts" / "measure_slm_slots.py"
          )
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)

          from openreview_cli.review import run_review
          from openreview_cli.review.playbook import BUNDLED_PLAYBOOKS

          MODE = "indemnitycheck"
          fixtures = ROOT / "tests" / "fixtures" / "benchmark" / MODE
          ground_truth = json.loads((fixtures / "ground_truth.json").read_text())
          paths = [str(ROOT / entry["path"]) for entry in ground_truth]

          # Same local model the grounding arm uses, via the documented env override, and the
          # same cost-ledger init the measure job needs before its first gateway call.
          harness._configure_slots(harness._LOCAL_GROUNDING_MODEL)
          harness._ensure_cost_ledger_database()

          # ONE product review over the tracked fixtures: the measure matrix job's product
          # review (`--model ollama/granite4:3b --mode indemnitycheck`) with grounding on and
          # left lenient (see the job comment for why not strict). It is run in-process here
          # rather than through `measure_slm_slots.py` because that script's review-mode report
          # carries only aggregate grounding counts; only the live assessments carry the
          # per-claim coverage number this pilot needs.
          reports = run_review(
              paths=paths,
              playbook_path=str(BUNDLED_PLAYBOOKS[MODE]),
              extraction_model="extraction",
              qa_model=None,
              no_pii=True,
              grounding_mode="lenient",
              mode=MODE,
              allow_password_prompt=False,
          )

          assessments = [a for r in reports for a in r.assessments]
          coverages = [a.grounding_presence for a in assessments]
          measured = [value for value in coverages if value is not None]
          verdicts = [
              a.grounding_verdict.value if a.grounding_verdict is not None else None
              for a in assessments
          ]

          # Five equal coverage bands over [0.0, 1.0]; the top band is inclusive so a verbatim
          # (1.0) claim lands in it.
          BAND_LABELS = ["0.0-0.2", "0.2-0.4", "0.4-0.6", "0.6-0.8", "0.8-1.0"]
          bands = dict.fromkeys(BAND_LABELS, 0)
          for value in measured:
              bands[BAND_LABELS[min(int(value * len(BAND_LABELS)), len(BAND_LABELS) - 1)]] += 1

          report = {
              "job": "grounding-pilot",
              "mode": MODE,
              "model": harness._LOCAL_GROUNDING_MODEL,
              "grounding_mode": "lenient",
              "pii_stripped": False,
              "git_sha": harness._git_sha(),
              "measured_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "documents": [r.document.filename for r in reports],
              "assessments": len(assessments),
              "with_coverage": len(measured),
              "accepted": verdicts.count("grounded"),
              "rejected": verdicts.count("ungrounded"),
              "uncertain": verdicts.count("uncertain"),
              "coverage_bands": bands,
              "coverage_values": sorted(round(value, 4) for value in measured),
          }
          out = pathlib.Path("results/grounding-pilot.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2))

          summary_lines = [
              f"model: `{report['model']}`; grounding mode: `{report['grounding_mode']}`",
              f"documents: {len(reports)}; claims assessed: {report['assessments']}; "
              f"claims with a coverage number: {report['with_coverage']}",
              "coverage bands (claims): "
              + ", ".join(f"{label}={bands[label]}" for label in BAND_LABELS),
              f"accepted (grounded): {report['accepted']}; "
              f"rejected (ungrounded): {report['rejected']}; uncertain: {report['uncertain']}",
          ]
          for line in summary_lines:
              print(f"[grounding-pilot] {line}")
          print(f"[grounding-pilot] JSON report written to {out}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### Grounding pilot (coverage distribution)\n\n")
                  for line in summary_lines:
                      handle.write(f"- {line}\n")
          PY

      - name: Fail when the pilot produced no assessments
        # Same fail-loud spirit as `grounding-accuracy`: exit 0 is not enough. A run with no
        # claims, or with no coverage number on any claim (grounding silently skipped), is a
        # green nothing, not a measurement.
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("results/grounding-pilot.json")
          if not path.exists():
              raise SystemExit(
                  f"FAIL: no pilot report at {path}: the review wrote nothing, so there is no "
                  "evidence that a grounded review ran"
              )

          report = json.loads(path.read_text())
          problems = []
          if report.get("assessments", 0) == 0:
              problems.append(
                  "assessments == 0: the review produced no claims at all, so there is no "
                  "coverage distribution and nothing was measured"
              )
          if report.get("with_coverage", 0) == 0:
              problems.append(
                  "with_coverage == 0: no claim carried a coverage number, so the pilot cannot "
                  "show whether real citations sit above the line (grounding ran? see the log)"
              )
          if report.get("assessments", 0) and report.get("uncertain", 0) == report["assessments"]:
              problems.append(
                  "every verdict is 'uncertain': a failed gateway call is swallowed and returned "
                  "as 'uncertain' (grounding/discriminator.py), so this run almost certainly "
                  "measured nothing"
              )

          if problems:
              print("FAIL: the pilot measured nothing:")
              for problem in problems:
                  print(f"  - {problem}")
              raise SystemExit(1)

          print(
              f"OK: assessments={report['assessments']} with_coverage={report['with_coverage']} "
              f"accepted={report['accepted']} rejected={report['rejected']} "
              f"uncertain={report['uncertain']}"
          )
          PY

      - name: Upload the pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-pilot
          path: results/grounding-pilot.json
          if-no-files-found: warn
