name: Ollama smoke test

# Phase 2 smoke test: one real call per model slot against a local Ollama.
# Read-only with respect to the product: this workflow only reads the code and
# runs the shipped `openreview gateway test` command. It fixes nothing.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen

      - name: Free disk space (torch + models are large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and wait until it answers
        run: |
          nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not start within 120s"
          cat /tmp/ollama-serve.log
          exit 1

      - name: Cache Ollama models
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-qwen3-4b-nomic-embed-text-qwen3-reranker-0.6b

      - name: Disk space before pulling models
        run: |
          df -h
          du -sh ~/.ollama/models 2>/dev/null || true

      - name: Pull models (a reranker pull failure is recorded, not fatal)
        run: |
          set -e
          ollama pull qwen3:4b
          ollama pull nomic-embed-text
          if ollama pull qwen3-reranker-0.6b > /tmp/reranker-pull.log 2>&1; then
            echo "reranker pull: OK"
          else
            echo "reranker pull: FAILED (recorded, continuing)"
            cat /tmp/reranker-pull.log
          fi
          ollama list

      - name: Disk space after pulling models
        run: |
          df -h
          du -sh ~/.ollama/models 2>/dev/null || true

      - name: Set every slot to Ollama
        run: |
          set -e
          uv run openreview gateway set reasoning  ollama/qwen3:4b
          uv run openreview gateway set extraction ollama/qwen3:4b
          uv run openreview gateway set grounding  ollama/qwen3:4b

      - name: Model string and api_base passed to litellm, per slot
        run: |
          uv run python - <<'PY'
          from openreview_cli.config.paths import get_config_dir
          from openreview_cli.config.loader import load_config
          from openreview_cli.gateway.registry import load_registry

          cfg = load_config(get_config_dir() / "config.yml")
          registry = load_registry()
          for slot in ("reasoning", "extraction", "grounding"):
              model = cfg["gateway"]["models"][slot]["primary"]
              provider = model.split("/", 1)[0]
              base = registry[provider].base_url if provider in registry else "UNKNOWN"
              print(f"{slot}: model={model} api_base={base}")
          PY

      - name: Run one real call per slot (a failure does not stop the others)
        run: |
          set +e
          failed=""
          for slot in reasoning extraction grounding; do
            echo "::group::gateway test ${slot}"
            uv run openreview gateway test "${slot}" > "/tmp/slot-${slot}.log" 2>&1
            code=$?
            echo "slot=${slot} exit_code=${code}"
            cat "/tmp/slot-${slot}.log"
            echo "::endgroup::"
            if [ "${code}" -ne 0 ]; then
              failed="${failed} ${slot}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "FAILED slots:${failed}"
            exit 1
          fi
          echo "All testable slots passed."
          exit 0
